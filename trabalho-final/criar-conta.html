<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Criação de conta no Hotel Pet.">
  <title>Criar Conta - Hotel Pet</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="login">

  <div><figure>
      <img src="imagens/fachada.jpg" alt="Dois cães correndo na área de lazer do Hotel Pet">
    </figure><div class="painel">

      <h1>Hotel Pet</h1>

      <form action="index.html" method="get">

        <div>
          <label>Login
            <input type="text" name="login" placeholder="Login" required>
          </label>
        </div>

        <div>
          <label>Senha
            <input type="password" placeholder="Senha" required>
          </label>
          <button type="button" class="olho"><img src="imagens/icone-olho.svg" alt="Mostrar ou ocultar senha"></button>
        </div>

        <input type="submit" value="Criar conta">

      </form>

      <p><a href="index.html">Já tem conta? Login</a></p>

    </div></div>

  <script src="js/dados.js"></script>
  <script src="js/utilitarios.js"></script>
  <script src="js/usuarios.js"></script>
  <script src="js/senha.js"></script>
</body>
</html>
