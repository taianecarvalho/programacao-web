<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Edição dos dados de um pet cadastrado no Hotel Pet.">
  <title>Editar Pet - Hotel Pet</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <div class="menu">
    <a href="pets.html"><img src="imagens/logo.svg" alt="Hotel Pet"></a>

    <ul>
      <li><a href="pets.html" class="ativo"><img src="imagens/icone-pet.svg" alt=""> Pets</a></li>
      <li><a href="reservas.html"><img src="imagens/icone-reservas.svg" alt=""> Reservas</a></li>
      <li><a href="usuarios.html"><img src="imagens/icone-usuarios.svg" alt=""> Usuários</a></li>
      <li><a href="configuracoes.html"><img src="imagens/icone-configuracoes.svg" alt=""> Configurações</a></li>
    </ul>
  </div><div class="conteudo">

    <div class="topo">
      <a href="editar-perfil.html"><img src="imagens/avatar.svg" alt=""> Taiane Carvalho</a>
      <a href="index.html">Sair</a>
    </div>

    <div class="trilha">
      <ol>
        <li><a href="pets.html">Home</a></li>
        <li>/</li>
        <li><a href="pets.html">Pets</a></li>
        <li>/</li>
        <li>Editar Pet</li>
      </ol>
    </div>

    <div class="painel">

      <h1>Editar Pet</h1>

      <form action="pets.html" method="get" class="formulario">

        <div class="campos">

          <label>Nome *
            <input type="text" name="nome" value="Anya" required>
          </label>

          <label>Tipo *
            <select name="tipo" required>
              <option value="">Selecione</option>
              <option value="cachorro" selected>Cachorro</option>
              <option value="gato">Gato</option>
            </select>
          </label>

          <label>Raça *
            <input type="text" name="raca" value="Golden Retriever" required>
          </label>

          <label>Proprietário *
            <select name="proprietario" required>
              <option value="">Selecione</option>
            </select>
          </label>

          <label>Tamanho *
            <select name="tamanho" required>
              <option value="">Selecione</option>
              <option value="pequeno">Pequeno</option>
              <option value="medio">Médio</option>
              <option value="grande" selected>Grande</option>
            </select>
          </label>

        </div><div class="imagem">

          <label>Imagem
            <input type="file" name="imagem" accept="image/*">
          </label>

          <figure class="foto">
            <img id="foto-atual" src="imagens/pet-anya.jpg" alt="Anya, cadela da raça Golden Retriever, deitada na grama">
            <figcaption>Imagem atual</figcaption>
          </figure>

        </div>

        <div class="acoes">
          <input type="submit" value="Salvar">
          <input type="button" value="Limpar" class="botao">
        </div>

      </form>

    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/utilitarios.js"></script>
  <script src="js/pets.js"></script>
</body>
</html>
