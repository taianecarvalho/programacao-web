<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hotel Pet - sistema de gerenciamento de estadia de pets.">
  <title>Login - Hotel Pet</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="login">

  <div><figure>
      <img src="imagens/fachada.jpg" alt="Dois cães correndo na área de lazer do Hotel Pet">
    </figure><div class="painel">

      <h1>Hotel Pet</h1>

      <form action="reservas.html" method="get">

        <div>
          <label>Login
            <input type="text" name="login" placeholder="Login" required>
          </label>
        </div>

        <div>
          <label>Senha
            <input type="password" placeholder="Senha" required>
          </label>
          <img src="imagens/icone-olho.svg" alt="Mostrar ou ocultar senha" class="olho">
        </div>

        <div class="linha">
          <label class="marcador">
            <input type="checkbox" name="conectado"> Mantenha-me conectado
          </label>
          Esqueci a senha
        </div>

        <input type="submit" value="Enviar">

      </form>

      <p>ou</p>

      <div class="sociais">
        <ul>
          <li><a href="reservas.html"><img src="imagens/icone-facebook.svg" alt="Entrar com Facebook"></a></li>
          <li><a href="reservas.html"><img src="imagens/icone-twitter.svg" alt="Entrar com Twitter"></a></li>
          <li><a href="reservas.html"><img src="imagens/icone-google.svg" alt="Entrar com Google"></a></li>
        </ul>
      </div>

      <p><a href="criar-conta.html">Criar uma conta</a></p>

    </div></div>

  <script src="js/senha.js"></script>
</body>
</html>
